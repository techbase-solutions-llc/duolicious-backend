# Production override for docker-compose.yml.
# Use:  docker compose -f docker-compose.yml -f docker-compose.production.yml --env-file .env.production up -d
#
# Differences from base compose:
#   - postgres + redis no longer expose ports to public internet
#     (DB and cache only reachable from inside the docker network)
#   - api / chat / status keep their public ports for ingress
#   - s3mock + smtp + chattest + chatjsontest disabled (replaced by DO Spaces +
#     Resend SMTP in production; test containers not deployed)
#   - DUO_ENV=prod -> api.main.sh + chat.main.sh switch to gunicorn / uvicorn
#     instead of dev autoreload
#
# Why explicit ${VAR} substitution instead of env_file:
# Docker compose's per-file precedence puts the override's `environment:` ABOVE
# the base file's `environment:`, but the override's `env_file:` BELOW its own
# `environment:` AND below the base file's `environment:`. So env_file values
# silently lose to base values like `DUO_SMTP_HOST: smtp`. The ${VAR} approach
# uses --env-file at compose-up time to substitute values directly into this
# override's `environment:` block, which wins over the base.
#
# Phase W staging caveat: no SSL termination here (nginx + certbot land
# when ahavah.app domain is registered). Frontend talks to droplet IP over
# plain HTTP for now.

services:
  status:
    ports:
      - "8080:8080"

  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - ahavah-postgres-data:/var/lib/postgresql/data

  redis:
    ports: !reset []
    # No --requirepass: the upstream Duolicious code (service/api/decorators.py
    # + service/chat/__init__.py) instantiates redis.Redis() without a
    # password kwarg. Adding auth here would silently break every redis call.
    # Mitigation: redis port is removed above so the service is only reachable
    # from inside the docker network — api/chat/cron containers — which is
    # an acceptable threat-model floor for a single-tenant deploy.
    volumes:
      - ahavah-redis-data:/data

  api:
    # FireHOL blocklist: the cron container builds blocklist.bin on this
    # shared volume; api workers mmap it read-only (antiabuse/firehol).
    volumes: !override
      - ahavah-firehol-data:/var/ahavah-firehol:ro
    ports:
      - "5000:5000"
    environment:
      DUO_FIREHOL_BIN: /var/ahavah-firehol/blocklist.bin
      # Runtime + DB
      DUO_ENV: prod
      DUO_DB_HOST: postgres
      DUO_DB_PORT: 5432
      DUO_DB_USER: postgres
      DUO_DB_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      DUO_REDIS_HOST: redis
      DUO_REDIS_PORT: 6379
      DUO_REDIS_PASS: ${REDIS_PASSWORD}
      # Resend SMTP (must override base "smtp:1025" defaults)
      DUO_SMTP_HOST: smtp.resend.com
      DUO_SMTP_PORT: "587"
      DUO_SMTP_USER: resend
      DUO_SMTP_PASS: ${DUO_SMTP_PASS:?DUO_SMTP_PASS must be set in .env.production}
      DUO_USE_RESEND_API: ${DUO_USE_RESEND_API}
      DUO_DISABLE_FIREHOL: ${DUO_DISABLE_FIREHOL}
      DUO_RESEND_FROM_OVERRIDE: ${DUO_RESEND_FROM_OVERRIDE}
      DUO_REPORT_EMAIL: "admin@techbaseltd.com 1"
      # Phase W push notifications (VAPID). PUSH_ENABLED in
      # service/notifications/__init__.py is bool(public AND private),
      # so leaving these blank disables push without breaking imports.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # CORS — Vercel previews + frontend domain
      DUO_CORS_ORIGINS: ${DUO_CORS_ORIGINS}
      # DO Spaces (must override base "s3mock" defaults)
      DUO_R2_BUCKET_NAME: ${DUO_R2_BUCKET_NAME}
      DUO_R2_AUDIO_BUCKET_NAME: ${DUO_R2_AUDIO_BUCKET_NAME}
      DUO_R2_ACCT_ID: ${DUO_R2_ACCT_ID}
      DUO_R2_ACCESS_KEY_ID: ${DUO_R2_ACCESS_KEY_ID}
      DUO_R2_ACCESS_KEY_SECRET: ${DUO_R2_ACCESS_KEY_SECRET}
      DUO_BOTO_ENDPOINT_URL: ${DUO_BOTO_ENDPOINT_URL}
      # The api does not SEND the weekly community email, the cron does. It
      # reads these so the Growth > Emails row can say when the next send is
      # due, which means the two services have to agree. Set them on the cron
      # alone and the dashboard reports "not scheduled" about a live mailing;
      # set them here alone and it promises a send nothing will make. Both,
      # or neither. Both services also need a restart for a change to take:
      # these are read once at import.
      DUO_CRON_COMMUNITY_WEEKLY_ENABLED: ${DUO_CRON_COMMUNITY_WEEKLY_ENABLED:-0}
      DUO_CRON_COMMUNITY_WEEKLY_WEEKDAY: ${DUO_CRON_COMMUNITY_WEEKLY_WEEKDAY:-1}
      DUO_CRON_COMMUNITY_WEEKLY_HOUR_UTC: ${DUO_CRON_COMMUNITY_WEEKLY_HOUR_UTC:-12}
      # Branded URLs (must override base "https://api.ahavah.app" defaults
      # — staging uses droplet IP until domain registered)
      AHAVAH_API_BASE_URL: ${AHAVAH_API_BASE_URL}
      AHAVAH_WEB_BASE_URL: ${AHAVAH_WEB_BASE_URL}
      AHAVAH_EMAIL_ASSETS_BASE_URL: ${AHAVAH_EMAIL_ASSETS_BASE_URL}
      AHAVAH_USER_IMAGES_BASE_URL: ${AHAVAH_USER_IMAGES_BASE_URL}
      AHAVAH_XMPP_DOMAIN: ${AHAVAH_XMPP_DOMAIN}
      AHAVAH_PRODUCT_NAME: ${AHAVAH_PRODUCT_NAME}
      AHAVAH_EMAIL_DOMAIN: ${AHAVAH_EMAIL_DOMAIN}
      # Pre-launch signup gate (default closed). Flip AHAVAH_SIGNUPS_OPEN=true at
      # launch. AHAVAH_SIGNUP_ALLOWED_DOMAINS = comma-separated email domains that
      # bypass the gate (the team's own domain) to test sign-in.
      AHAVAH_SIGNUPS_OPEN: ${AHAVAH_SIGNUPS_OPEN:-false}
      AHAVAH_SIGNUP_ALLOWED_DOMAINS: ${AHAVAH_SIGNUP_ALLOWED_DOMAINS:-}
      # Photo gate (health review finding 91, service/photo_gate.py). Off until
      # the W8 prompt that tells a gated member why ships. 1 turns it on.
      AHAVAH_PHOTO_GATE_ENABLED: ${AHAVAH_PHOTO_GATE_ENABLED:-0}
      # Leads from a sign-in code on the checklist or a couple tool
      # (TEC-1845, service/leads). Off until the privacy page's "Before you
      # join" paragraph and the checklist's new wording are live; 1 turns
      # it on.
      AHAVAH_TOOL_LEADS_ENABLED: ${AHAVAH_TOOL_LEADS_ENABLED:-0}
      # Mail held for the owner's proof (health review Wave 3,
      # service/campaigns/switches.py). Each is off until he confirms its
      # proof; 1 turns one on. Set on both api and cron: the cron sends the
      # scheduled ones, the api builds E2 for the Send button, queues the
      # friend-joined email at sign-up and the Spotlight card email.
      AHAVAH_LIKES_WAITING_ENABLED: ${AHAVAH_LIKES_WAITING_ENABLED:-0}
      AHAVAH_MATCH_REMINDER_ENABLED: ${AHAVAH_MATCH_REMINDER_ENABLED:-0}
      AHAVAH_MESSAGE_REMINDER_ENABLED: ${AHAVAH_MESSAGE_REMINDER_ENABLED:-0}
      AHAVAH_PROFILE_VIEW_EMAIL_ENABLED: ${AHAVAH_PROFILE_VIEW_EMAIL_ENABLED:-0}
      AHAVAH_ONE_PHOTO_NUDGE_ENABLED: ${AHAVAH_ONE_PHOTO_NUDGE_ENABLED:-0}
      AHAVAH_E2_PERSONAL_ENABLED: ${AHAVAH_E2_PERSONAL_ENABLED:-0}
      AHAVAH_REFERRAL_MEMBER_BODY_ENABLED: ${AHAVAH_REFERRAL_MEMBER_BODY_ENABLED:-0}
      AHAVAH_FRIEND_JOINED_ENABLED: ${AHAVAH_FRIEND_JOINED_ENABLED:-0}
      AHAVAH_E1_RESEND_ENABLED: ${AHAVAH_E1_RESEND_ENABLED:-0}
      AHAVAH_SPOTLIGHT_COPY_ENABLED: ${AHAVAH_SPOTLIGHT_COPY_ENABLED:-0}
      # Quick questions (TEC-1845). Off until the owner confirms each proof.
      # The api needs them too: Admin > Questions shows their state and E2
      # is built here for the Send button.
      AHAVAH_QUESTIONS_LIVE_ENABLED: ${AHAVAH_QUESTIONS_LIVE_ENABLED:-0}
      AHAVAH_QUESTION_PUSH_ENABLED: ${AHAVAH_QUESTION_PUSH_ENABLED:-0}
      AHAVAH_MATCH_QUESTION_PUSH_ENABLED: ${AHAVAH_MATCH_QUESTION_PUSH_ENABLED:-0}
      AHAVAH_E2_QUESTION_LINE_ENABLED: ${AHAVAH_E2_QUESTION_LINE_ENABLED:-0}
      AHAVAH_QUESTIONS_LAUNCH_EMAIL_ENABLED: ${AHAVAH_QUESTIONS_LAUNCH_EMAIL_ENABLED:-0}
      AHAVAH_QUESTIONS_LAUNCH_PUSH_ENABLED: ${AHAVAH_QUESTIONS_LAUNCH_PUSH_ENABLED:-0}
      # Together (TEC-1845). Off until launch (live) and until the owner
      # confirms each email's proof. The api serves the routes and queues
      # the emails.
      AHAVAH_TOGETHER_LIVE_ENABLED: ${AHAVAH_TOGETHER_LIVE_ENABLED:-0}
      AHAVAH_TOGETHER_INVITE_EMAIL_ENABLED: ${AHAVAH_TOGETHER_INVITE_EMAIL_ENABLED:-0}
      AHAVAH_TOGETHER_ANSWERED_EMAIL_ENABLED: ${AHAVAH_TOGETHER_ANSWERED_EMAIL_ENABLED:-0}
      AHAVAH_TOGETHER_READY_EMAIL_ENABLED: ${AHAVAH_TOGETHER_READY_EMAIL_ENABLED:-0}
      AHAVAH_TOGETHER_SUMMARY_EMAIL_ENABLED: ${AHAVAH_TOGETHER_SUMMARY_EMAIL_ENABLED:-0}
      # Gatherings (TEC-1845). Off until launch and until the owner confirms each proof.
      AHAVAH_EVENTS_LIVE_ENABLED: ${AHAVAH_EVENTS_LIVE_ENABLED:-0}
      AHAVAH_EVENTS_HOSTING_ENABLED: ${AHAVAH_EVENTS_HOSTING_ENABLED:-0}
      AHAVAH_EVENTS_LIST_ENABLED: ${AHAVAH_EVENTS_LIST_ENABLED:-0}
      AHAVAH_EVENTS_INVITE_ENABLED: ${AHAVAH_EVENTS_INVITE_ENABLED:-0}
      AHAVAH_EVENTS_CONFIRM_EMAIL_ENABLED: ${AHAVAH_EVENTS_CONFIRM_EMAIL_ENABLED:-0}
      AHAVAH_EVENTS_REMINDER_EMAIL_ENABLED: ${AHAVAH_EVENTS_REMINDER_EMAIL_ENABLED:-0}
      AHAVAH_EVENTS_CHANGE_EMAIL_ENABLED: ${AHAVAH_EVENTS_CHANGE_EMAIL_ENABLED:-0}
      AHAVAH_EVENTS_CANCEL_EMAIL_ENABLED: ${AHAVAH_EVENTS_CANCEL_EMAIL_ENABLED:-0}
      AHAVAH_EVENTS_DIGEST_EMAIL_ENABLED: ${AHAVAH_EVENTS_DIGEST_EMAIL_ENABLED:-0}
      AHAVAH_EVENTS_MANAGE_EMAIL_ENABLED: ${AHAVAH_EVENTS_MANAGE_EMAIL_ENABLED:-0}
      # Matchmaker (TEC-1845). Off until launch and until the owner confirms each proof.
      AHAVAH_MATCHMAKER_LIVE_ENABLED: ${AHAVAH_MATCHMAKER_LIVE_ENABLED:-0}
      AHAVAH_MATCHMAKER_ALERTS_ENABLED: ${AHAVAH_MATCHMAKER_ALERTS_ENABLED:-0}
      AHAVAH_MATCHMAKER_VISITOR_ALERTS_ENABLED: ${AHAVAH_MATCHMAKER_VISITOR_ALERTS_ENABLED:-0}
      AHAVAH_MATCHMAKER_INTRODUCTIONS_ENABLED: ${AHAVAH_MATCHMAKER_INTRODUCTIONS_ENABLED:-0}
      AHAVAH_MATCHMAKER_MENTORS_ENABLED: ${AHAVAH_MATCHMAKER_MENTORS_ENABLED:-0}
      AHAVAH_MATCHMAKER_ALERT_EMAIL_ENABLED: ${AHAVAH_MATCHMAKER_ALERT_EMAIL_ENABLED:-0}
      AHAVAH_MATCHMAKER_VISITOR_CONFIRM_EMAIL_ENABLED: ${AHAVAH_MATCHMAKER_VISITOR_CONFIRM_EMAIL_ENABLED:-0}
      AHAVAH_MATCHMAKER_VISITOR_ALERT_EMAIL_ENABLED: ${AHAVAH_MATCHMAKER_VISITOR_ALERT_EMAIL_ENABLED:-0}
      AHAVAH_MATCHMAKER_RECOMMEND_EMAIL_ENABLED: ${AHAVAH_MATCHMAKER_RECOMMEND_EMAIL_ENABLED:-0}
      AHAVAH_MATCHMAKER_INTRO_EMAIL_ENABLED: ${AHAVAH_MATCHMAKER_INTRO_EMAIL_ENABLED:-0}
      AHAVAH_MATCHMAKER_MENTOR_INVITE_EMAIL_ENABLED: ${AHAVAH_MATCHMAKER_MENTOR_INVITE_EMAIL_ENABLED:-0}
      AHAVAH_MATCHMAKER_ALERT_PUSH_ENABLED: ${AHAVAH_MATCHMAKER_ALERT_PUSH_ENABLED:-0}
      AHAVAH_MATCHMAKER_INTRO_PUSH_ENABLED: ${AHAVAH_MATCHMAKER_INTRO_PUSH_ENABLED:-0}
      # Owner alerts (TEC-1897), to the owner only. Off until he has seen
      # each proof (scripts/send_admin_alert_proofs.py). The cron sends them;
      # the api reads them to show whether they are on.
      AHAVAH_ADMIN_ALERTS_CRON_ENABLED: ${AHAVAH_ADMIN_ALERTS_CRON_ENABLED:-0}
      AHAVAH_STALE_POST_ALERT_ENABLED: ${AHAVAH_STALE_POST_ALERT_ENABLED:-0}
      # Meta Conversions API (service/metapixel.py) — no-op when blank.
      AHAVAH_META_PIXEL_ID: ${AHAVAH_META_PIXEL_ID:-}
      AHAVAH_META_CAPI_ACCESS_TOKEN: ${AHAVAH_META_CAPI_ACCESS_TOKEN:-}
      # The sign-up measurement (service/metapixel.py) runs only when this is
      # "enabled". Off since F07 (9 Sep 2026); back on 16 Oct 2026 by the owner,
      # once the privacy pages said what Meta measures.
      AHAVAH_REGISTRATION_TELEMETRY: ${AHAVAH_REGISTRATION_TELEMETRY:-}
      # Cloudflare Turnstile secret — zero-config rollout: no-op when blank,
      # active when set. Honeypot is always on regardless.
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Sign-up page stamp (service/signupguard). Off: a new address with
      # no stamp still gets a code. Turn on once the web that sends the
      # stamp is live; forged and too-fast stamps are refused either way.
      AHAVAH_SIGNUP_STAMP_REQUIRED: ${AHAVAH_SIGNUP_STAMP_REQUIRED:-false}
      # Optional integrations (no-op when empty)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY}
      POSTHOG_HOST: ${POSTHOG_HOST}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET_IDENTITY: ${STRIPE_WEBHOOK_SECRET_IDENTITY}
      STRIPE_WEBHOOK_SECRET_CHECKOUT: ${STRIPE_WEBHOOK_SECRET_CHECKOUT}
      STRIPE_PRICE_PREMIUM_MONTH: ${STRIPE_PRICE_PREMIUM_MONTH}
      STRIPE_PRICE_PREMIUM_QUARTER: ${STRIPE_PRICE_PREMIUM_QUARTER}
      STRIPE_PRICE_PREMIUM_YEAR: ${STRIPE_PRICE_PREMIUM_YEAR}
      STRIPE_PRICE_TOKENS_SINGLE: ${STRIPE_PRICE_TOKENS_SINGLE}
      STRIPE_PRICE_TOKENS_STARTER: ${STRIPE_PRICE_TOKENS_STARTER}
      STRIPE_PRICE_TOKENS_PLUS: ${STRIPE_PRICE_TOKENS_PLUS}
      STRIPE_PRICE_TOKENS_PRO: ${STRIPE_PRICE_TOKENS_PRO}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID}
      # Session secret (used by service code that signs/verifies)
      SESSION_TOKEN_SECRET: ${SESSION_TOKEN_SECRET:?SESSION_TOKEN_SECRET must be set in .env.production}
      # Shared secret the spotlight scheduler sends as X-Growth-Cron.
      # Blank disables cron access entirely (fails closed).
      AHAVAH_GROWTH_CRON_SECRET: ${AHAVAH_GROWTH_CRON_SECRET:-}

  chat:
    volumes: !reset []
    ports:
      - "5442:5442"
      - "5443:5443"
    environment:
      DUO_ENV: prod
      DUO_DB_HOST: postgres
      DUO_DB_PORT: 5432
      DUO_DB_USER: postgres
      DUO_DB_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      DUO_REDIS_HOST: redis
      DUO_REDIS_PORT: 6379
      DUO_REDIS_PASS: ${REDIS_PASSWORD}
      DUO_R2_AUDIO_BUCKET_NAME: ${DUO_R2_AUDIO_BUCKET_NAME}
      DUO_R2_ACCT_ID: ${DUO_R2_ACCT_ID}
      DUO_R2_ACCESS_KEY_ID: ${DUO_R2_ACCESS_KEY_ID}
      DUO_R2_ACCESS_KEY_SECRET: ${DUO_R2_ACCESS_KEY_SECRET}
      DUO_BOTO_ENDPOINT_URL: ${DUO_BOTO_ENDPOINT_URL}
      DUO_CHAT_PORTS: ${DUO_CHAT_PORTS}
      AHAVAH_XMPP_DOMAIN: ${AHAVAH_XMPP_DOMAIN}
      SESSION_TOKEN_SECRET: ${SESSION_TOKEN_SECRET:?SESSION_TOKEN_SECRET must be set in .env.production}

  cron:
    # Writer side of the FireHOL blocklist (see api ro mount).
    volumes: !override
      - ahavah-firehol-data:/var/ahavah-firehol
    environment:
      DUO_FIREHOL_BIN: /var/ahavah-firehol/blocklist.bin
      DUO_ENV: prod
      DUO_DB_HOST: postgres
      DUO_DB_PORT: 5432
      DUO_DB_USER: postgres
      DUO_DB_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      DUO_DB_API_NAME: duo_api
      # Resend SMTP (override base smtp:1025)
      DUO_SMTP_HOST: smtp.resend.com
      DUO_SMTP_PORT: "587"
      DUO_SMTP_USER: resend
      DUO_SMTP_PASS: ${DUO_SMTP_PASS:?DUO_SMTP_PASS must be set in .env.production}
      DUO_USE_RESEND_API: ${DUO_USE_RESEND_API}
      DUO_DISABLE_FIREHOL: ${DUO_DISABLE_FIREHOL}
      DUO_RESEND_FROM_OVERRIDE: ${DUO_RESEND_FROM_OVERRIDE}
      DUO_REPORT_EMAIL: "admin@techbaseltd.com 1"
      # Campaign runners (emails/send_*.py) exec in this container (it has
      # SMTP creds; api does not) and sign unsubscribe tokens, so they need
      # the same signing secret as the api /u/<token> verifier.
      SESSION_TOKEN_SECRET: ${SESSION_TOKEN_SECRET:?SESSION_TOKEN_SECRET must be set in .env.production}
      # Phase W push notifications (VAPID). PUSH_ENABLED in
      # service/notifications/__init__.py is bool(public AND private),
      # so leaving these blank disables push without breaking imports.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # DO Spaces (override base s3mock)
      DUO_R2_BUCKET_NAME: ${DUO_R2_BUCKET_NAME}
      DUO_R2_AUDIO_BUCKET_NAME: ${DUO_R2_AUDIO_BUCKET_NAME}
      DUO_R2_ACCT_ID: ${DUO_R2_ACCT_ID}
      DUO_R2_ACCESS_KEY_ID: ${DUO_R2_ACCESS_KEY_ID}
      DUO_R2_ACCESS_KEY_SECRET: ${DUO_R2_ACCESS_KEY_SECRET}
      DUO_BOTO_ENDPOINT_URL: ${DUO_BOTO_ENDPOINT_URL}
      # Production cron poll intervals (slower than dev). Each default here
      # matches the module's own hardcoded default (service/cron/*/__init__.py),
      # so a variable missing OR blank in .env.production behaves the same:
      # env_int() already tolerates blank, this is belt and braces against the
      # substitution itself handing the process an empty string.
      #
      # Which direction the fallback errs: these defaults are the MODULE's
      # defaults, not the values in .env.production.template, and the two are
      # not the same. For several variables the module default is the shorter
      # interval, so a blanked variable makes production poll HARDER than the
      # template intends, not slower: email 10s against the template's 30s,
      # photo and audio cleaner 60s against 300s, garbage records 10s against
      # 300s. Two err the other way: autodeactivate2 600s against 300s and
      # profile reporter 600s against 60s. The
      # fallback is chosen to keep a cron alive rather than to match the
      # template, so treat a blank value as a configuration bug to fix, not as
      # a safe steady state.
      #
      # The three DRY_RUN flags below are not intervals and do NOT fall back
      # to a module default. Each module reads its flag as
      # `os.environ.get(NAME, 'true').lower() not in ['false','f','0','no']`,
      # so an empty string parses to True: a blank value would silently put
      # auto-deactivate and both cleaners into dry run with no crash, no
      # traceback and a green deploy, which the deploy's cron assertion cannot
      # see. `:-false` makes a blank or missing value mean what production
      # means by it. This is the same blank-value root cause as the 2026-09-14
      # incident, with a quieter symptom.
      DUO_CRON_PROFILE_REPORTER_POLL_SECONDS: ${DUO_CRON_PROFILE_REPORTER_POLL_SECONDS:-600}
      DUO_CRON_EMAIL_POLL_SECONDS: ${DUO_CRON_EMAIL_POLL_SECONDS:-10}
      DUO_CRON_AUTODEACTIVATE2_DRY_RUN: ${DUO_CRON_AUTODEACTIVATE2_DRY_RUN:-true}
      DUO_CRON_AUTODEACTIVATE2_POLL_SECONDS: ${DUO_CRON_AUTODEACTIVATE2_POLL_SECONDS:-600}
      DUO_CRON_PHOTO_CLEANER_DRY_RUN: ${DUO_CRON_PHOTO_CLEANER_DRY_RUN:-false}
      DUO_CRON_PHOTO_CLEANER_POLL_SECONDS: ${DUO_CRON_PHOTO_CLEANER_POLL_SECONDS:-60}
      DUO_CRON_AUDIO_CLEANER_DRY_RUN: ${DUO_CRON_AUDIO_CLEANER_DRY_RUN:-false}
      DUO_CRON_AUDIO_CLEANER_POLL_SECONDS: ${DUO_CRON_AUDIO_CLEANER_POLL_SECONDS:-60}
      DUO_CRON_GARBAGE_RECORDS_POLL_SECONDS: ${DUO_CRON_GARBAGE_RECORDS_POLL_SECONDS:-10}
      DUO_CRON_SPOTLIGHT_RETENTION_POLL_SECONDS: ${DUO_CRON_SPOTLIGHT_RETENTION_POLL_SECONDS:-86400}
      DUO_CRON_EMAIL_OUTBOX_POLL_SECONDS: ${DUO_CRON_EMAIL_OUTBOX_POLL_SECONDS:-30}
      DUO_CRON_SPOTLIGHT_CLEANUP_POLL_SECONDS: ${DUO_CRON_SPOTLIGHT_CLEANUP_POLL_SECONDS:-600}
      # The weekly community email (e2). OFF by default: turning it on mails
      # the whole membership, so it is a deliberate act, not a side effect of
      # a deploy. These four must ALSO be set on the `api` service, which
      # reads the same settings to tell the Growth tab when the next send is
      # due; set them here only and the dashboard says "not scheduled" about
      # a mailing that is live.
      DUO_CRON_COMMUNITY_WEEKLY_ENABLED: ${DUO_CRON_COMMUNITY_WEEKLY_ENABLED:-0}
      DUO_CRON_COMMUNITY_WEEKLY_WEEKDAY: ${DUO_CRON_COMMUNITY_WEEKLY_WEEKDAY:-1}
      DUO_CRON_COMMUNITY_WEEKLY_HOUR_UTC: ${DUO_CRON_COMMUNITY_WEEKLY_HOUR_UTC:-12}
      DUO_CRON_COMMUNITY_WEEKLY_POLL_SECONDS: ${DUO_CRON_COMMUNITY_WEEKLY_POLL_SECONDS:-3600}
      DUO_CRON_REFERRAL_INTRO_ENABLED: ${DUO_CRON_REFERRAL_INTRO_ENABLED:-1}
      DUO_CRON_REFERRAL_INTRO_POLL_SECONDS: ${DUO_CRON_REFERRAL_INTRO_POLL_SECONDS:-86400}
      # The weekly prompt post (TEC-1845). Off until the owner confirms the
      # caption and the prompt bank's wording.
      DUO_CRON_QUESTION_OF_WEEK_ENABLED: ${DUO_CRON_QUESTION_OF_WEEK_ENABLED:-0}
      # Mail held for the owner's proof (health review Wave 3,
      # service/campaigns/switches.py). Each is off until he confirms its
      # proof; 1 turns one on. Set on both api and cron: the cron sends the
      # scheduled ones, the api builds E2 for the Send button, queues the
      # friend-joined email at sign-up and the Spotlight card email.
      AHAVAH_LIKES_WAITING_ENABLED: ${AHAVAH_LIKES_WAITING_ENABLED:-0}
